name: Publish Python Package

on:
  push:
    tags: ['py/v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Third-party actions pinned to SHAs; see ci.yml header for the update
# procedure. pypi-publish is the most critical since it runs with
# id-token: write on the pypi environment.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/py/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 -c "import re,os; v=os.environ['REF_NAME'].removeprefix('py/v'); p='python/pyproject.toml'; t=open(p).read(); open(p,'w').write(re.sub(r'^version = .*',f'version = \"{v}\"',t,flags=re.M))"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-04-15)

      - name: Create venv and install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin[patchelf] numpy pydantic pytest h5py zarr ruff mypy
        working-directory: python

      - name: Build and install (dev)
        run: .venv/bin/maturin develop --features pybindings
        working-directory: python

      - name: Ruff
        run: .venv/bin/ruff check src/ tests/
        working-directory: python

      - name: Mypy
        run: .venv/bin/mypy src/
        working-directory: python

      - name: Pytest
        run: .venv/bin/pytest -m "not integration"
        working-directory: python

  # One abi3 wheel per platform: `abi3-py311` (crates/solver/Cargo.toml) targets
  # CPython's stable ABI, so a single cp311-abi3 wheel covers 3.11 and every
  # later interpreter. That's why there is no python-version axis here.
  #
  # The `include` entries are deliberately the ONLY matrix keys. Adding a base
  # axis alongside them does NOT create a cross product: each include applies to
  # every combination and the last one wins, silently collapsing the whole job
  # to windows-latest/x64. See "Expanding or adding matrix configurations" in
  # the GitHub Actions matrix docs.
  build-wheels:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/py/v')
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 -c "import re,os; v=os.environ['REF_NAME'].removeprefix('py/v'); p='python/pyproject.toml'; t=open(p).read(); open(p,'w').write(re.sub(r'^version = .*',f'version = \"{v}\"',t,flags=re.M))"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # abi3 floor; the wheel it emits runs on 3.11+

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features pybindings
          sccache: 'true'
          manylinux: auto
          working-directory: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist

  build-sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/py/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 -c "import re,os; v=os.environ['REF_NAME'].removeprefix('py/v'); p='python/pyproject.toml'; t=open(p).read(); open(p,'w').write(re.sub(r'^version = .*',f'version = \"{v}\"',t,flags=re.M))"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: python

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: python/dist

  # Tag-gated. `Set version from tag` above is itself tag-gated, so on a
  # workflow_dispatch run the version stays at the 0.0.0 placeholder — without
  # this guard a manual dry run would publish `calab 0.0.0` to PyPI, which can
  # never be re-uploaded or reused. Dispatch builds the wheels and uploads them
  # as artifacts; only a `py/v*` tag actually publishes.
  publish:
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/py/v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
